name: Go AKS CI/CD

on:
  workflow_call:
    inputs:
      aks-cluster:
        required: true
        type: string

      aks-resource-group:
        required: true
        type: string

      acr-name:
        required: true
        type: string

      helm-release:
        required: true
        type: string

      helm-chart-path:
        required: true
        type: string

      namespace:
        required: true
        type: string

      go-version:
        required: true
        type: string

    secrets:
      AZURE_CLIENT_ID:
        required: true

      AZURE_TENANT_ID:
        required: true

      AZURE_SUBSCRIPTION_ID:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install kubelogin
        uses: azure/use-kubelogin@v1.2
        with:
          kubelogin-version: 'v0.0.24'

      - name: Set AKS context
        uses: azure/aks-set-context@v5
        with:
          resource-group: ${{ inputs.aks-resource-group }}
          cluster-name: ${{ inputs.aks-cluster }}
          admin: 'false'
          use-kubelogin: 'true'

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ inputs.acr-name }}

      - name: Download dependencies
        run: go mod download

      - name: Build Go application
        run: go build -v ./...

      - name: Run Go tests
        run: go test ./...

      - name: Set image name
        run: echo "IMAGE_NAME=$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: docker build -t ${{ inputs.acr-name }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.run_number }} .

      - name: Push Docker image
        run: docker push ${{ inputs.acr-name }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.run_number }}

      - name: Deploy to AKS with Helm
        run: |
          helm upgrade --install ${{ inputs.helm-release }} ${{ inputs.helm-chart-path }} \
            --namespace ${{ inputs.namespace }} \
            --set image.repository=${{ inputs.acr-name }}.azurecr.io/${{ env.IMAGE_NAME }} \
            --set image.tag=${{ github.run_number }}
